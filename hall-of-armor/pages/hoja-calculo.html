<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hoja de cálculo | Hall of Armor</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css"><link rel="stylesheet" href="../css/hall.css?v=20260926-4"></head><body data-page="hoja-calculo" data-title="Hoja de cálculo"><div id="app"></div><template id="page-view"><div class="page-heading"><div><div class="eyebrow">CAJA DEL TALLER</div><h1>Ingresos y egresos</h1><p>Registra cada movimiento. El saldo se calcula desde cero con los movimientos guardados.</p></div><button class="btn" data-action="ledger-export"><i class="ti ti-download"></i>Exportar CSV</button></div>
<div class="grid metrics"><div class="card metric"><div class="metric-top">Ingresos<i class="ti ti-trending-up"></i></div><div class="metric-value" data-ledger-income>Bs 0,00</div></div><div class="card metric"><div class="metric-top">Egresos<i class="ti ti-trending-down"></i></div><div class="metric-value" data-ledger-expense>Bs 0,00</div></div><div class="card metric"><div class="metric-top">Saldo actual<i class="ti ti-currency-boliviano"></i></div><div class="metric-value" data-ledger-balance>Bs 0,00</div></div></div>
<section class="card"><div class="section-head"><div><h2>Registrar movimiento</h2><p class="muted">Completa fecha, motivo y el importe como ingreso o egreso.</p></div></div><form id="cash-movement-form" class="form-grid"><div class="field"><label>Fecha</label><input name="date" type="date" required></div><div class="field"><label>Motivo</label><input name="reason" maxlength="500" required placeholder="Motivo del movimiento"></div><div class="field"><label>Tipo</label><select name="type"><option value="ingreso">Ingreso</option><option value="egreso">Egreso</option></select></div><div class="field"><label>Importe (Bs)</label><input name="amount" type="number" min="0.01" step="0.01" required placeholder="0,00"></div><div class="full"><button class="btn primary"><i class="ti ti-plus"></i>Guardar movimiento</button></div></form></section>
<section class="card"><div class="section-head"><h2>Movimientos de caja</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Motivo</th><th>Ingresos</th><th>Egresos</th><th>Saldo</th></tr></thead><tbody id="ledger-table"></tbody></table></div></section>
<section class="card"><div class="section-head"><div><h2>Google Sheets</h2><span class="status amber">CONFIGURACIÓN PENDIENTE</span></div></div><p>La hoja debe tener únicamente estas columnas, en este orden: Fecha, Motivo, Ingresos, Egresos, Saldo. Guarda aquí su enlace para abrirla. La sincronización automática requiere configurar Apps Script o credenciales de Google.</p><form id="sheet-form" class="form-grid"><div class="field full"><label>URL de la hoja de cálculo</label><input name="url" type="url" placeholder="https://docs.google.com/spreadsheets/d/..."></div><div class="full"><button class="btn primary"><i class="ti ti-device-floppy"></i>Guardar URL</button><button type="button" class="btn" data-action="open-sheet"><i class="ti ti-external-link"></i>Abrir hoja</button></div></form></section></template><script src="../js/hall.js?v=20260926-5"></script><script src="../js/page-shell.js?v=20260926-5"></script></body></html>
